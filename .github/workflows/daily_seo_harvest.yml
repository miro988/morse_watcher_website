name: Daily SEO Opportunity Harvest

on:
  schedule:
    # Runs daily at 13:00 UTC (6:00 AM PDT / 9:00 AM EDT)
    - cron: "0 13 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  issues: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Configure Search Console credentials
        env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: |
          if [ -n "$GSC_CREDENTIALS" ]; then
            echo "$GSC_CREDENTIALS" > scripts/service-account.json
            echo "Service account credentials configured."
          else
            echo "Notice: GSC_CREDENTIALS secret not set. Harvester will run in demo mode."
          fi

      - name: Run GSC Opportunity Harvester
        run: |
          python3 scripts/gsc_harvester.py --output SEARCH_OPPORTUNITIES.md
          cat SEARCH_OPPORTUNITIES.md >> $GITHUB_STEP_SUMMARY

      - name: Commit updated opportunities report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SEARCH_OPPORTUNITIES.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(seo): update daily search opportunities backlog [skip ci]"
            git push
          else
            echo "No changes in opportunities report."
          fi
